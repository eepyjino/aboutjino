<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hello! im Jino</title>

<!-- Fallback handwritten font (swap out in style.css if you have your own font) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>




<div class="card">

    <!-- Gray browser-style header bar -->
    <div class="card-header"></div>

    <!-- White content area -->
    <div class="card-content">

   
        <div class="profile">

          
            <div class="face-placeholder">
                <img src="assets/images/face.svg" alt="Jino">
               
            </div>

            <div class="intro-text">
                <h1 class="main-title">hello! im Jino</h1>
                <p class="subtitle">regular guy</p>
            </div>

        </div>

        
        <div class="navigation">

            <div class="nav-item popup-trigger" data-popup="aboutPopup">
              
                <div class="about-icon-placeholder">
                    
                    <svg class="icon-about" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20,18 H72 A12,12 0 0 1 84,30 V62 A12,12 0 0 1 72,74 H44 L26,90 V74 H20 A12,12 0 0 1 8,62 V30 A12,12 0 0 1 20,18 Z"/>
                        <circle class="icon-about-dot" cx="46" cy="38" r="5.5"/>
                        <rect class="icon-about-dot" x="40.5" y="48" width="11" height="24" rx="5.5"/>
                    </svg>
                </div>
                <span class="nav-label">about</span>
            </div>

            <div class="nav-item popup-trigger" data-popup="workPopup">
              
             
                <div class="work-icon-placeholder">
                  
                    <svg class="icon-work" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10,30 A8,8 0 0 1 18,22 H38 L48,32 H82 A8,8 0 0 1 90,40 V72 A8,8 0 0 1 82,80 H18 A8,8 0 0 1 10,72 Z"/>
                    </svg>
                </div>
                <span class="nav-label">work</span>
            </div>

        </div>

       
        <div class="contact">
            <p class="contact-title">contact me:</p>

            <div class="contact-icons">

                
                <div class="contact-icon-placeholder contact-icon-1">
                    <img src="assets/images/info-icon.svg" alt="instagram">
                
                </div>

                
                <div class="contact-icon-placeholder contact-icon-2">
                    <img src="assets/images/fb-icon.svg" alt="facebook">
                    
                </div>

               
                <div class="contact-icon-placeholder contact-icon-3">
                    <img src="assets/images/mail-icon.svg" alt="email">
                   
                </div>

            </div>
        </div>

    </div>

</div>



<div class="popup-window" id="aboutPopup">

    <!-- Title bar — this is the drag handle -->
    <div class="popup-header">
        <span class="popup-title">about</span>
        <button class="popup-close" aria-label="Close">[x]</button>
    </div>

    <div class="popup-content">
        <p>regular guy, what did you expect?</p>
    </div>
</div>



     ================================ -->
<div class="popup-window" id="workPopup">

    <!-- Title bar — this is the drag handle -->
    <div class="popup-header">
        <span class="popup-title">work</span>
        <button class="popup-close" aria-label="Close">[x]</button>
    </div>

    <div class="popup-content">
        <p>unemployed</p>
    </div>
</div>


<script src="script.js"></script>
</body>
</html>
